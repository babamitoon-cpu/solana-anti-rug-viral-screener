
<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOLANA RADAR PRO</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;font-size:16px}
body{margin:0;background:#fff;color:#111}
header,main{max-width:1100px;margin:auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #ddd}
h1{font-size:22px;margin:0}
h2{font-size:19px}
button{background:#16a34a;color:white;border:0;padding:10px 14px;border-radius:8px;cursor:pointer}
input{padding:9px;border:1px solid #ccc;border-radius:7px;width:100%;margin:5px 0 12px}
.note{background:#f9fafb;padding:12px;border:1px solid #ddd;border-radius:10px;margin:12px 0}
.token{border:1px solid #ddd;border-radius:12px;padding:14px;margin:12px 0}
.row{display:flex;gap:12px;align-items:center}
.coin{width:48px;height:48px;border-radius:50%;background:#f3f4f6;display:grid;place-items:center;overflow:hidden;flex-shrink:0}
.coin img{width:100%;height:100%;object-fit:cover}
.muted{color:#555}
.green{color:#16803d}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.metric{background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:10px;overflow-wrap:anywhere}
.metric b{display:block;margin-top:5px}
.address{overflow-wrap:anywhere;font-size:14px}
@media(min-width:700px){.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
  <div>
    <h1>SOLANA RADAR PRO</h1>
    <div class="muted">Penyaring token meme Solana</div>
  </div>
  <button id="scanBtn" onclick="scan()">Scan sekarang</button>
</header>
<main>
  <div class="note">
    Data yang tidak tersedia ditandai UNKNOWN. Skor pasar bukan jaminan token aman.
  </div>
  <label>Market cap minimum (USD)</label>
  <input id="minMc" type="number" value="50000">
  <label>Likuiditas minimum (USD)</label>
  <input id="minLiq" type="number" value="10000">
  <div id="status" class="muted">Belum melakukan scan.</div>
  <h2>Kandidat token</h2>
  <div id="results"></div>
</main>
<script>
/*
  PENTING:
  Key di HTML publik dapat dilihat siapa saja.
  Gunakan key baru dan batasi pemakaiannya jika memungkinkan.
*/
const HELIUS_API_KEY = "GANTI_DENGAN_API_KEY_BARU";
const HELIUS_RPC = "https://mainnet.helius-rpc.com/?api-key=";

async function helius(method, params) {
  if (!HELIUS_API_KEY || HELIUS_API_KEY === "GANTI_DENGAN_API_KEY_BARU") {
    throw new Error("API key Helius belum dikonfigurasi");
  }
  const response = await fetch(HELIUS_RPC + encodeURIComponent(HELIUS_API_KEY), {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      jsonrpc:"2.0", id:1, method, params
    })
  });
  if (!response.ok) throw new Error("Helius HTTP " + response.status);
  const json = await response.json();
  if (json.error) throw new Error(json.error.message || "Helius API error");
  return json.result;
}

async function getHolderCount(mint) {
  /*
    Memindai akun token per halaman.
    Jika batas tercapai atau data tidak lengkap, hasil UNKNOWN.
    Metode getTokenAccounts perlu tersedia pada paket Helius yang digunakan.
  */
  const owners = new Set();
  let cursor = null;
  const pageLimit = 100;
  for (let page = 0; page < pageLimit; page++) {
    const params = {mint, limit:1000};
    if (cursor) params.cursor = cursor;
    const result = await helius("getTokenAccounts", params);
    const accounts = result && (result.token_accounts || result.accounts);
    if (!Array.isArray(accounts)) return "UNKNOWN";
    for (const account of accounts) {
      const owner = account.owner || account.ownerAddress;
      const amount = Number(
        account.amount ?? account.tokenAmount?.amount ?? 0
      );
      if (owner && amount > 0) owners.add(owner);
    }
    cursor = result.cursor || result.nextCursor || null;
    if (!cursor || accounts.length === 0) return owners.size;
  }
  return "UNKNOWN";
}

function money(value) {
  if (!Number.isFinite(Number(value))) return "UNKNOWN";
  return Number(value).toLocaleString("en-US", {
    style:"currency", currency:"USD", maximumFractionDigits:0
  });
}
function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  })[c]);
}
function logoMarkup(url, symbol) {
  const fallback = escapeHtml((symbol || "◎").slice(0,3));
  if (!url) return `<span>${fallback}</span>`;
  return `<img src="${escapeHtml(url)}" alt=""
    onerror="this.remove();this.parentElement.textContent='${fallback}'">`;
}

async function scan() {
  const button = document.getElementById("scanBtn");
  const status = document.getElementById("status");
  const results = document.getElementById("results");
  button.disabled = true;
  results.innerHTML = "";
  status.textContent = "Mengambil pair Solana...";
  try {
    const response = await fetch(
      "https://api.dexscreener.com/token-profiles/latest/v1"
    );
    if (!response.ok) throw new Error("DexScreener HTTP " + response.status);
    const profiles = await response.json();
    const solanaProfiles = (Array.isArray(profiles) ? profiles : [])
      .filter(x => x.chainId === "solana" && x.tokenAddress)
      .slice(0, 30);

    const seen = new Set();
    const pairs = [];
    for (const profile of solanaProfiles) {
      if (seen.has(profile.tokenAddress)) continue;
      seen.add(profile.tokenAddress);
      try {
        const r = await fetch(
          "https://api.dexscreener.com/latest/dex/tokens/" +
          encodeURIComponent(profile.tokenAddress)
        );
        if (!r.ok) continue;
        const data = await r.json();
        for (const pair of (data.pairs || [])) {
          if (pair.chainId === "solana") pairs.push(pair);
        }
      } catch (_) {}
    }

    const minMc = Number(document.getElementById("minMc").value || 0);
    const minLiq = Number(document.getElementById("minLiq").value || 0);
    const filtered = pairs.filter(p =>
      Number(p.marketCap || p.fdv || 0) >= minMc &&
      Number(p.liquidity?.usd || 0) >= minLiq
    ).sort((a,b) =>
      Number(b.volume?.h1 || 0) - Number(a.volume?.h1 || 0)
    ).slice(0, 20);

    if (!filtered.length) {
      results.textContent = "Belum ada token yang memenuhi filter.";
    }

    status.textContent = `Scan selesai · ${filtered.length} kandidat ditampilkan`;
    for (const p of filtered) {
      const base = p.baseToken || {};
      const address = base.address || "";
      const card = document.createElement("article");
      card.className = "token";
      card.innerHTML = `
        <div class="row">
          <div class="coin">${logoMarkup(p.info?.imageUrl, base.symbol)}</div>
          <div>
            <strong>${escapeHtml(base.name || "Token tidak diketahui")}
            ($${escapeHtml(base.symbol || "?")})</strong>
            <div class="muted">${escapeHtml(p.dexId || "DEX Solana")}</div>
            <div class="address">${escapeHtml(address)}</div>
          </div>
        </div>
        <div class="metrics">
          <div class="metric">Market cap<b>${money(p.marketCap || p.fdv)}</b></div>
          <div class="metric">Likuiditas<b>${money(p.liquidity?.usd)}</b></div>
          <div class="metric">Volume 1 jam<b>${money(p.volume?.h1)}</b></div>
          <div class="metric">Holder unik<b class="holders">Memuat...</b></div>
          <div class="metric">Kepemilikan Dev<b>UNKNOWN</b></div>
          <div class="metric">Top 10 pemilik<b>UNKNOWN</b></div>
          <div class="metric">Skor pasar<b>UNKNOWN</b></div>
          <div class="metric">Status risiko<b>Belum lengkap</b></div>
        </div>
        <p class="muted">Dev Supply, Top 10, dan skor risiko belum dihitung oleh kode ini.</p>
        <a href="${escapeHtml(p.url || "#")}" target="_blank" rel="noopener">Buka pair di DexScreener</a>
      `;
      results.appendChild(card);
      const holderEl = card.querySelector(".holders");
      getHolderCount(address)
        .then(n => holderEl.textContent =
          typeof n === "number" ? n.toLocaleString("en-US") : "UNKNOWN")
        .catch(() => holderEl.textContent = "UNKNOWN");
    }
  } catch (error) {
    status.textContent = "Scan gagal: " + error.message;
  } finally {
    button.disabled = false;
  }
}
</script>
</body>
</html>
